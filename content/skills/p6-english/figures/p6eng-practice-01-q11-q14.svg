<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 913" width="384" height="913" role="img" aria-labelledby="fig-p6eng-practice-01-q11-q14-title fig-p6eng-practice-01-q11-q14-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"><title id="fig-p6eng-practice-01-q11-q14-title">Bayleaf Residents' Network presents Fix-It Fair</title><desc id="fig-p6eng-practice-01-q11-q14-desc">A poster: Bayleaf Residents' Network presents Fix-It Fair. Date: Saturday, 14 March. Time: 9 a.m. to 1 p.m.. Venue: Bayleaf Community Club, Level 2. Repair Corner (9 a.m. to 12 noon). Bike Clinic (10 a.m. to 1 p.m.). Upcycling Workshop (11 a.m.). Swap Table (9 a.m. to 1 p.m.).</desc><rect x="0" y="0" width="384" height="913" fill="#ffffff"/><g transform="translate(12 12)" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 0)"><rect x="1" y="1" width="358" height="195.9" rx="13" fill="#D6EFE6" stroke="none"/><rect x="1" y="16" width="358" height="180.9" fill="#D6EFE6" stroke="none"/><g transform="translate(14 13) scale(0.75)"><g transform="translate(0 0)"><polygon points="12,2 14.8,9.1 22.5,9.6 16.6,14.5 18.5,21.9 12,17.8 5.5,21.9 7.4,14.5 1.5,9.6 9.2,9.1" fill="#1F6F5C" stroke="#1F6F5C" stroke-width="1" stroke-linejoin="round"/></g></g><text x="38" y="27" font-size="14" text-anchor="start" font-weight="600" fill="#1f2a37" stroke="none">Bayleaf Residents' Network presents</text><text x="14" y="64.9" font-size="28" text-anchor="start" font-weight="800" fill="#1F6F5C" stroke="none">Fix-It Fair</text><text x="14" y="91.1" font-size="14.6" text-anchor="start" font-style="italic" fill="#1f2a37" stroke="none">Don't throw it out. Fix it together!</text><circle cx="310" cy="72" r="36" fill="#1F6F5C" stroke="none"/><text x="310" y="68.1" font-size="13.4" text-anchor="middle" font-weight="800" fill="#ffffff" stroke="none">FREE</text><text x="310" y="86" font-size="14.6" text-anchor="middle" font-weight="800" fill="#ffffff" stroke="none">ENTRY</text><g transform="translate(14 117) scale(0.75)"><g transform="translate(0 0)"><rect x="3" y="5" width="18" height="16" rx="2.5" fill="#D6EFE6" stroke="#1F6F5C" stroke-width="1.6"/><line x1="3" y1="10" x2="21" y2="10" fill="none" stroke="#1F6F5C" stroke-width="1.8"/><line x1="8" y1="3" x2="8" y2="7" fill="none" stroke="#1F6F5C" stroke-width="1.8"/><line x1="16" y1="3" x2="16" y2="7" fill="none" stroke="#1F6F5C" stroke-width="1.8"/><circle cx="8" cy="14" r="1" fill="#1F6F5C"/><circle cx="8" cy="18" r="1" fill="#1F6F5C"/><circle cx="12" cy="14" r="1" fill="#1F6F5C"/><circle cx="12" cy="18" r="1" fill="#1F6F5C"/><circle cx="16" cy="14" r="1" fill="#1F6F5C"/><circle cx="16" cy="18" r="1" fill="#1F6F5C"/></g></g><text x="39" y="131.2" font-size="14.6" text-anchor="start" font-weight="700" fill="#1f2a37" stroke="none">Date:</text><text x="80.8" y="131.2" font-size="14.6" text-anchor="start" fill="#1f2a37" stroke="none">Saturday, 14 March</text><g transform="translate(14 140.3) scale(0.75)"><g transform="translate(0 0)"><circle cx="12" cy="12" r="9.5" fill="#D6EFE6" stroke="#1F6F5C" stroke-width="1.6"/><line x1="12" y1="12" x2="12" y2="6.5" fill="none" stroke="#1F6F5C" stroke-width="1.8"/><line x1="12" y1="12" x2="16" y2="14" fill="none" stroke="#1F6F5C" stroke-width="1.8"/></g></g><text x="39" y="154.5" font-size="14.6" text-anchor="start" font-weight="700" fill="#1f2a37" stroke="none">Time:</text><text x="85.8" y="154.5" font-size="14.6" text-anchor="start" fill="#1f2a37" stroke="none">9 a.m. to 1 p.m.</text><g transform="translate(14 163.6) scale(0.75)"><g transform="translate(0 0)"><path d="M 12 22 C 6 15 4 12 4 9 A 8 8 0 0 1 20 9 C 20 12 18 15 12 22 Z" fill="#D6EFE6" stroke="#1F6F5C" stroke-width="1.6"/><circle cx="12" cy="9" r="3" fill="#ffffff" stroke="#1F6F5C" stroke-width="1.4"/></g></g><text x="39" y="177.8" font-size="14.6" text-anchor="start" font-weight="700" fill="#1f2a37" stroke="none">Venue:</text><text x="92.8" y="177.8" font-size="14.6" text-anchor="start" fill="#1f2a37" stroke="none">Bayleaf Community Club, Level 2</text><g transform="translate(18 205.9)"><g transform="translate(0 0) scale(0.92)"><path d="M 25 64 L 23 96 M 35 64 L 37 96" fill="none" stroke="#1f2a37" stroke-width="3" stroke-linecap="round"/><path d="M 22 36 L 14 58 M 38 36 L 56 14" fill="none" stroke="#1f2a37" stroke-width="3" stroke-linecap="round"/><rect x="20" y="30" width="20" height="36" rx="7" fill="#D6EFE6" stroke="#1f2a37" stroke-width="1.8"/><circle cx="30" cy="18" r="11" fill="#ffffff" stroke="#1f2a37" stroke-width="1.8"/><path d="M 19 17 Q 19 4 30 5 Q 41 4 41 17 Q 36 10 30 10 Q 24 10 19 17 Z" fill="#1f2a37"/><circle cx="43" cy="14" r="4.5" fill="#1f2a37"/><circle cx="17" cy="14" r="4.5" fill="#1f2a37"/><circle cx="26" cy="18" r="1.4" fill="#1f2a37"/><circle cx="34" cy="18" r="1.4" fill="#1f2a37"/><path d="M 26 22 Q 30 28 34 22 Z" fill="#1f2a37"/></g><g transform="translate(61.2 51.5) scale(0.405)"><path d="M 33 38 C 33 8 67 8 67 38" fill="none" stroke="#1f2a37" stroke-width="4"/><path d="M 18 38 L 82 38 L 88 90 Q 88 95 83 95 L 17 95 Q 12 95 12 90 Z" fill="#ffffff" stroke="#1f2a37" stroke-width="3"/></g></g><g transform="translate(286.8 205.9)"><g transform="translate(0 0) scale(0.92)"><path d="M 25 64 L 23 96 M 35 64 L 37 96" fill="none" stroke="#1f2a37" stroke-width="3" stroke-linecap="round"/><path d="M 22 36 L 14 58 M 38 36 L 50 26 L 52 10" fill="none" stroke="#1f2a37" stroke-width="3" stroke-linecap="round"/><rect x="20" y="30" width="20" height="36" rx="7" fill="#D6EFE6" stroke="#1f2a37" stroke-width="1.8"/><circle cx="30" cy="18" r="11" fill="#ffffff" stroke="#1f2a37" stroke-width="1.8"/><path d="M 19 16 Q 20 4 31 5 Q 41 6 41 15 Q 34 9 19 16 Z" fill="#1f2a37"/><circle cx="26" cy="18" r="1.4" fill="#1f2a37"/><circle cx="34" cy="18" r="1.4" fill="#1f2a37"/><path d="M 26 22 Q 30 28 34 22 Z" fill="#1f2a37"/></g></g><rect x="119.2" y="235.9" width="121.5" height="32" rx="16" fill="#1F6F5C" stroke="none"/><text x="180" y="258.3" font-size="17.9" text-anchor="middle" font-weight="800" fill="#ffffff" stroke="none">What's on</text><rect x="14" y="309.9" width="332" height="112.4" rx="10" fill="#ffffff" stroke="#1F6F5C" stroke-width="1.6"/><g transform="translate(24 321.9) scale(1.167)"><g transform="translate(0 0)"><polygon points="12,2 14.8,9.1 22.5,9.6 16.6,14.5 18.5,21.9 12,17.8 5.5,21.9 7.4,14.5 1.5,9.6 9.2,9.1" fill="#1F6F5C" stroke="#1F6F5C" stroke-width="1" stroke-linejoin="round"/></g></g><text x="62" y="335.7" font-size="16.2" text-anchor="start" font-weight="800" fill="#1F6F5C" stroke="none">Repair Corner</text><text x="62" y="355.9" font-size="14" text-anchor="start" font-weight="600" fill="#5c6878" stroke="none">9 a.m. to 12 noon</text><text x="62" y="378.9" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Bring up to 2 broken items: toys, fans,</text><text x="62" y="397.1" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">lamps or clothes.</text><text x="62" y="415.3" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">No large appliances, please.</text><rect x="14" y="430.3" width="332" height="94.2" rx="10" fill="#ffffff" stroke="#1F6F5C" stroke-width="1.6"/><g transform="translate(24 442.3) scale(1.167)"><g transform="translate(0 0)"><path d="M 12 22 C 6 15 4 12 4 9 A 8 8 0 0 1 20 9 C 20 12 18 15 12 22 Z" fill="#D6EFE6" stroke="#1F6F5C" stroke-width="1.6"/><circle cx="12" cy="9" r="3" fill="#ffffff" stroke="#1F6F5C" stroke-width="1.4"/></g></g><text x="62" y="456.1" font-size="16.2" text-anchor="start" font-weight="800" fill="#1F6F5C" stroke="none">Bike Clinic</text><text x="62" y="476.3" font-size="14" text-anchor="start" font-weight="600" fill="#5c6878" stroke="none">10 a.m. to 1 p.m.</text><text x="62" y="499.3" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Free tyre and brake checks.</text><text x="62" y="517.5" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Spare parts cost extra.</text><rect x="14" y="532.5" width="332" height="94.2" rx="10" fill="#ffffff" stroke="#1F6F5C" stroke-width="1.6"/><g transform="translate(24 544.5) scale(1.167)"><g transform="translate(0 0)"><path d="M 12 3 C 3 3 1 12 4 17 C 7 22 12 19 12 17 C 12 14 15 14 18 15 C 23 16 23 3 12 3 Z" fill="#D6EFE6" stroke="#1F6F5C" stroke-width="1.6"/><circle cx="8" cy="9" r="1.6" fill="#1F6F5C"/><circle cx="12" cy="7" r="1.6" fill="#1F6F5C"/><circle cx="16" cy="9" r="1.6" fill="#1F6F5C"/><circle cx="7" cy="14" r="1.6" fill="#1F6F5C"/></g></g><text x="62" y="558.3" font-size="16.2" text-anchor="start" font-weight="800" fill="#1F6F5C" stroke="none">Upcycling Workshop</text><text x="62" y="578.5" font-size="14" text-anchor="start" font-weight="600" fill="#5c6878" stroke="none">11 a.m.</text><text x="62" y="601.5" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Turn old T-shirts into tote bags.</text><text x="62" y="619.7" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">$5 per person. Ages 10 and above.</text><rect x="14" y="634.7" width="332" height="94.2" rx="10" fill="#ffffff" stroke="#1F6F5C" stroke-width="1.6"/><g transform="translate(24 646.7) scale(1.167)"><g transform="translate(0 0)"><rect x="4" y="10" width="16" height="11" rx="1.5" fill="#D6EFE6" stroke="#1F6F5C" stroke-width="1.6"/><rect x="3" y="7" width="18" height="4" rx="1" fill="#D6EFE6" stroke="#1F6F5C" stroke-width="1.6"/><line x1="12" y1="7" x2="12" y2="21" fill="none" stroke="#1F6F5C" stroke-width="1.8"/><path d="M 12 7 C 8 1 4 5 12 7 C 20 5 16 1 12 7" fill="none" stroke="#1F6F5C" stroke-width="1.8"/></g></g><text x="62" y="660.5" font-size="16.2" text-anchor="start" font-weight="800" fill="#1F6F5C" stroke="none">Swap Table</text><text x="62" y="680.7" font-size="14" text-anchor="start" font-weight="600" fill="#5c6878" stroke="none">9 a.m. to 1 p.m.</text><text x="62" y="703.7" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Leave a book or toy in good condition and</text><text x="62" y="721.9" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">take one home.</text><rect x="14" y="736.9" width="332" height="94.2" rx="10" fill="#D6EFE6" stroke="#1F6F5C" stroke-width="1.6"/><text x="26" y="759.8" font-size="15.1" text-anchor="start" font-weight="800" fill="#1f2a37" stroke="none">Register for a Repair Corner slot by 7</text><text x="26" y="778.7" font-size="15.1" text-anchor="start" font-weight="800" fill="#1f2a37" stroke="none">March</text><text x="26" y="800.8" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Slots are limited. Walk-ins are welcome if slots</text><text x="26" y="819" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">remain.</text><text x="180" y="858" font-size="13.4" text-anchor="middle" fill="#5c6878" stroke="none">Children under 12 must come with an adult.</text><text x="180" y="875.5" font-size="13.4" text-anchor="middle" fill="#5c6878" stroke="none">Questions? Email hello@bayleaffixit.sg</text><rect x="1" y="1" width="358" height="886" rx="14" fill="none" stroke="#1F6F5C" stroke-width="2"/></g></g></svg>

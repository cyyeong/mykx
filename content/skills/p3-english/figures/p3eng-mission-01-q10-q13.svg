<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 875" width="384" height="875" role="img" aria-labelledby="fig-p3eng-mission-01-q10-q13-title fig-p3eng-mission-01-q10-q13-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"><title id="fig-p3eng-mission-01-q10-q13-title">The Little Explorers Club presents Dino Discovery Day</title><desc id="fig-p3eng-mission-01-q10-q13-desc">A poster: The Little Explorers Club presents Dino Discovery Day. Date: Sunday, 15 November. Time: 10 a.m. to 4 p.m.. Venue: Sunrise Science Centre, Hall B. Fossil Dig (10 a.m. to 12 noon). Dino Craft Corner (1 p.m. to 3 p.m.). Roar Contest (3.30 p.m.). Dino Café (Open all day).</desc><rect x="0" y="0" width="384" height="875" fill="#ffffff"/><g transform="translate(12 12)" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 0)"><rect x="1" y="1" width="358" height="213.2" rx="13" fill="#F6D7B0" stroke="none"/><rect x="1" y="16" width="358" height="198.2" fill="#F6D7B0" stroke="none"/><g transform="translate(14 13) scale(0.75)"><g transform="translate(0 0)"><polygon points="12,2 14.8,9.1 22.5,9.6 16.6,14.5 18.5,21.9 12,17.8 5.5,21.9 7.4,14.5 1.5,9.6 9.2,9.1" fill="#C0541A" stroke="#C0541A" stroke-width="1" stroke-linejoin="round"/></g></g><text x="38" y="27" font-size="14" text-anchor="start" font-weight="600" fill="#1f2a37" stroke="none">The Little Explorers Club presents</text><text x="14" y="64.9" font-size="28" text-anchor="start" font-weight="800" fill="#C0541A" stroke="none">Dino Discovery</text><text x="14" y="97.1" font-size="28" text-anchor="start" font-weight="800" fill="#C0541A" stroke="none">Day</text><text x="14" y="123.3" font-size="14.6" text-anchor="start" font-style="italic" fill="#1f2a37" stroke="none">Dig, discover and roar with laughter!</text><circle cx="310" cy="72" r="36" fill="#C0541A" stroke="none"/><text x="310" y="68.1" font-size="13.4" text-anchor="middle" font-weight="800" fill="#ffffff" stroke="none">AGES</text><text x="310" y="86" font-size="14.6" text-anchor="middle" font-weight="800" fill="#ffffff" stroke="none">6 TO 12</text><g transform="translate(14 134.3) scale(0.75)"><g transform="translate(0 0)"><rect x="3" y="5" width="18" height="16" rx="2.5" fill="#F6D7B0" stroke="#C0541A" stroke-width="1.6"/><line x1="3" y1="10" x2="21" y2="10" fill="none" stroke="#C0541A" stroke-width="1.8"/><line x1="8" y1="3" x2="8" y2="7" fill="none" stroke="#C0541A" stroke-width="1.8"/><line x1="16" y1="3" x2="16" y2="7" fill="none" stroke="#C0541A" stroke-width="1.8"/><circle cx="8" cy="14" r="1" fill="#C0541A"/><circle cx="8" cy="18" r="1" fill="#C0541A"/><circle cx="12" cy="14" r="1" fill="#C0541A"/><circle cx="12" cy="18" r="1" fill="#C0541A"/><circle cx="16" cy="14" r="1" fill="#C0541A"/><circle cx="16" cy="18" r="1" fill="#C0541A"/></g></g><text x="39" y="148.6" font-size="14.6" text-anchor="start" font-weight="700" fill="#1f2a37" stroke="none">Date:</text><text x="80.8" y="148.6" font-size="14.6" text-anchor="start" fill="#1f2a37" stroke="none">Sunday, 15 November</text><g transform="translate(14 157.6) scale(0.75)"><g transform="translate(0 0)"><circle cx="12" cy="12" r="9.5" fill="#F6D7B0" stroke="#C0541A" stroke-width="1.6"/><line x1="12" y1="12" x2="12" y2="6.5" fill="none" stroke="#C0541A" stroke-width="1.8"/><line x1="12" y1="12" x2="16" y2="14" fill="none" stroke="#C0541A" stroke-width="1.8"/></g></g><text x="39" y="171.9" font-size="14.6" text-anchor="start" font-weight="700" fill="#1f2a37" stroke="none">Time:</text><text x="85.8" y="171.9" font-size="14.6" text-anchor="start" fill="#1f2a37" stroke="none">10 a.m. to 4 p.m.</text><g transform="translate(14 180.9) scale(0.75)"><g transform="translate(0 0)"><path d="M 12 22 C 6 15 4 12 4 9 A 8 8 0 0 1 20 9 C 20 12 18 15 12 22 Z" fill="#F6D7B0" stroke="#C0541A" stroke-width="1.6"/><circle cx="12" cy="9" r="3" fill="#ffffff" stroke="#C0541A" stroke-width="1.4"/></g></g><text x="39" y="195.2" font-size="14.6" text-anchor="start" font-weight="700" fill="#1f2a37" stroke="none">Venue:</text><text x="92.8" y="195.2" font-size="14.6" text-anchor="start" fill="#1f2a37" stroke="none">Sunrise Science Centre, Hall B</text><g transform="translate(18 223.2)"><g transform="translate(0 0) scale(0.92)"><path d="M 25 80 L 14 86 L 14 98 M 35 80 L 46 92 L 50 98" fill="none" stroke="#1f2a37" stroke-width="3" stroke-linecap="round"/><path d="M 22 52 L 12 70 M 38 52 L 50 70" fill="none" stroke="#1f2a37" stroke-width="3" stroke-linecap="round"/><rect x="20" y="46" width="20" height="34" rx="7" fill="#F6D7B0" stroke="#1f2a37" stroke-width="1.8"/><circle cx="30" cy="34" r="11" fill="#ffffff" stroke="#1f2a37" stroke-width="1.8"/><path d="M 19 32 Q 20 20 31 21 Q 41 22 41 31 Q 34 25 19 32 Z" fill="#1f2a37"/><circle cx="26" cy="34" r="1.4" fill="#1f2a37"/><circle cx="34" cy="34" r="1.4" fill="#1f2a37"/><path d="M 26 38 Q 30 44 34 38 Z" fill="#1f2a37"/></g><g transform="translate(61.2 50.9) scale(0.933)"><path d="M 6 40 L 4 24 L 14 8 L 34 4 L 52 12 L 57 30 L 50 41 Z" fill="#e8ecf1" stroke="#1f2a37" stroke-width="1.8"/><path d="M 30 23 m 0 0 a 2 2 0 1 1 3 1 a 5 5 0 1 1 -7 -4 a 9 9 0 1 1 13 8 a 12 12 0 0 1 -11 10" fill="none" stroke="#C0541A" stroke-width="1.6"/></g></g><g transform="translate(286.8 223.2)"><g transform="translate(0 0) scale(0.92)"><path d="M 25 64 L 23 96 M 35 64 L 37 96" fill="none" stroke="#1f2a37" stroke-width="3" stroke-linecap="round"/><path d="M 22 36 L 10 10 M 38 36 L 50 10" fill="none" stroke="#1f2a37" stroke-width="3" stroke-linecap="round"/><rect x="20" y="30" width="20" height="36" rx="7" fill="#F6D7B0" stroke="#1f2a37" stroke-width="1.8"/><circle cx="30" cy="18" r="11" fill="#ffffff" stroke="#1f2a37" stroke-width="1.8"/><path d="M 19 17 Q 19 4 30 5 Q 41 4 41 17 Q 36 10 30 10 Q 24 10 19 17 Z" fill="#1f2a37"/><circle cx="43" cy="14" r="4.5" fill="#1f2a37"/><circle cx="17" cy="14" r="4.5" fill="#1f2a37"/><circle cx="26" cy="18" r="1.4" fill="#1f2a37"/><circle cx="34" cy="18" r="1.4" fill="#1f2a37"/><path d="M 26 22 Q 30 28 34 22 Z" fill="#1f2a37"/></g></g><rect x="117.9" y="253.2" width="124.2" height="32" rx="16" fill="#C0541A" stroke="none"/><text x="180" y="275.7" font-size="17.9" text-anchor="middle" font-weight="800" fill="#ffffff" stroke="none">Highlights</text><rect x="14" y="327.2" width="332" height="94.2" rx="10" fill="#ffffff" stroke="#C0541A" stroke-width="1.6"/><g transform="translate(24 339.2) scale(1.167)"><g transform="translate(0 0)"><polygon points="12,2 14.8,9.1 22.5,9.6 16.6,14.5 18.5,21.9 12,17.8 5.5,21.9 7.4,14.5 1.5,9.6 9.2,9.1" fill="#C0541A" stroke="#C0541A" stroke-width="1" stroke-linejoin="round"/></g></g><text x="62" y="353.1" font-size="16.2" text-anchor="start" font-weight="800" fill="#C0541A" stroke="none">Fossil Dig</text><text x="62" y="373.3" font-size="14" text-anchor="start" font-weight="600" fill="#5c6878" stroke="none">10 a.m. to 12 noon</text><text x="62" y="396.3" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Dig for fossils in our giant sandpit!</text><text x="62" y="414.5" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Each child gets a free fossil to take home.</text><rect x="14" y="429.4" width="332" height="94.2" rx="10" fill="#ffffff" stroke="#C0541A" stroke-width="1.6"/><g transform="translate(24 441.4) scale(1.167)"><g transform="translate(0 0)"><path d="M 12 3 C 3 3 1 12 4 17 C 7 22 12 19 12 17 C 12 14 15 14 18 15 C 23 16 23 3 12 3 Z" fill="#F6D7B0" stroke="#C0541A" stroke-width="1.6"/><circle cx="8" cy="9" r="1.6" fill="#C0541A"/><circle cx="12" cy="7" r="1.6" fill="#C0541A"/><circle cx="16" cy="9" r="1.6" fill="#C0541A"/><circle cx="7" cy="14" r="1.6" fill="#C0541A"/></g></g><text x="62" y="455.3" font-size="16.2" text-anchor="start" font-weight="800" fill="#C0541A" stroke="none">Dino Craft Corner</text><text x="62" y="475.5" font-size="14" text-anchor="start" font-weight="600" fill="#5c6878" stroke="none">1 p.m. to 3 p.m.</text><text x="62" y="498.5" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Make your own dinosaur mask.</text><text x="62" y="516.7" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">$3 per mask. All materials provided.</text><rect x="14" y="531.6" width="332" height="94.2" rx="10" fill="#ffffff" stroke="#C0541A" stroke-width="1.6"/><g transform="translate(24 543.6) scale(1.167)"><g transform="translate(0 0)"><path d="M 7 3 L 17 3 L 16 11 Q 12 15 8 11 Z" fill="#F6D7B0" stroke="#C0541A" stroke-width="1.6"/><path d="M 7 5 Q 2 5 4 9 Q 5 11 8 10 M 17 5 Q 22 5 20 9 Q 19 11 16 10" fill="none" stroke="#C0541A" stroke-width="1.8"/><line x1="12" y1="14" x2="12" y2="18" fill="none" stroke="#C0541A" stroke-width="1.8"/><rect x="7.5" y="18" width="9" height="3" rx="1" fill="#F6D7B0" stroke="#C0541A" stroke-width="1.6"/></g></g><text x="62" y="557.5" font-size="16.2" text-anchor="start" font-weight="800" fill="#C0541A" stroke="none">Roar Contest</text><text x="62" y="577.7" font-size="14" text-anchor="start" font-weight="600" fill="#5c6878" stroke="none">3.30 p.m.</text><text x="62" y="600.7" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Who has the loudest roar?</text><text x="62" y="618.9" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Open to children aged 8 and above.</text><rect x="14" y="633.8" width="332" height="76" rx="10" fill="#ffffff" stroke="#C0541A" stroke-width="1.6"/><g transform="translate(24 645.8) scale(1.167)"><g transform="translate(0 0)"><path d="M 3 12 L 21 12 Q 20 21 12 21 Q 4 21 3 12 Z" fill="#F6D7B0" stroke="#C0541A" stroke-width="1.6"/><path d="M 9 9 Q 7 6 9 3 M 14 9 Q 12 6 14 3" fill="none" stroke="#C0541A" stroke-width="1.8"/></g></g><text x="62" y="659.7" font-size="16.2" text-anchor="start" font-weight="800" fill="#C0541A" stroke="none">Dino Café</text><text x="62" y="679.9" font-size="14" text-anchor="start" font-weight="600" fill="#5c6878" stroke="none">Open all day</text><text x="62" y="702.9" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Snacks and drinks for sale.</text><rect x="14" y="717.8" width="332" height="93.5" rx="10" fill="#F6D7B0" stroke="#C0541A" stroke-width="1.6"/><text x="26" y="740.7" font-size="15.1" text-anchor="start" font-weight="800" fill="#1f2a37" stroke="none">Tickets: $12 per child · $8 per adult</text><text x="26" y="762.9" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Early-bird price: $10 per child if you buy by 31</text><text x="26" y="781.1" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">October.</text><text x="26" y="799.3" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Buy tickets at www.littleexplorers.sg</text><text x="180" y="838.3" font-size="13.4" text-anchor="middle" fill="#5c6878" stroke="none">For enquiries, email hello@littleexplorers.sg</text><rect x="1" y="1" width="358" height="848.8" rx="14" fill="none" stroke="#C0541A" stroke-width="2"/></g></g></svg>

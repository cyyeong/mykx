start" fill="#1f2a37" stroke="none">See the Moon and Saturn up close!</text><text x="62" y="503.4" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Only if the sky is clear.</text><rect x="14" y="518.3" width="332" height="94.2" rx="10" fill="#ffffff" stroke="#3D348B" stroke-width="1.6"/><g transform="translate(24 530.3) scale(1.167)"><g transform="translate(0 0)"><path d="M 12 3 C 3 3 1 12 4 17 C 7 22 12 19 12 17 C 12 14 15 14 18 15 C 23 16 23 3 12 3 Z" fill="#D9D4F5" stroke="#3D348B" stroke-width="1.6"/><circle cx="8" cy="9" r="1.6" fill="#3D348B"/><circle cx="12" cy="7" r="1.6" fill="#3D348B"/><circle cx="16" cy="9" r="1.6" fill="#3D348B"/><circle cx="7" cy="14" r="1.6" fill="#3D348B"/></g></g><text x="62" y="544.2" font-size="16.2" text-anchor="start" font-weight="800" fill="#3D348B" stroke="none">Rocket Workshop</text><text x="62" y="564.4" font-size="14" text-anchor="start" font-weight="600" fill="#5c6878" stroke="none">7.30 p.m.</text><text x="62" y="587.4" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Build and launch a paper rocket.</text><text x="62" y="605.6" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">For children aged 8 and above.</text><rect x="14" y="620.5" width="332" height="76" rx="10" fill="#ffffff" stroke="#3D348B" stroke-width="1.6"/><g transform="translate(24 632.5) scale(1.167)"><g transform="translate(0 0)"><path d="M 3 12 L 21 12 Q 20 21 12 21 Q 4 21 3 12 Z" fill="#D9D4F5" stroke="#3D348B" stroke-width="1.6"/><path d="M 9 9 Q 7 6 9 3 M 14 9 Q 12 6 14 3" fill="none" stroke="#3D348B" stroke-width="1.8"/></g></g><text x="62" y="646.4" font-size="16.2" text-anchor="start" font-weight="800" fill="#3D348B" stroke="none">Space Snacks</text><text x="62" y="666.6" font-size="14" text-anchor="start" font-weight="600" fill="#5c6878" stroke="none">Open all evening</text><text x="62" y="689.6" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Astronaut ice cream at $2 each.</text><rect x="14" y="704.5" width="332" height="94.2" rx="10" fill="#D9D4F5" stroke="#3D348B" stroke-width="1.6"/><text x="26" y="727.4" font-size="15.1" text-anchor="start" font-weight="800" fill="#1f2a37" stroke="none">Tickets: $15 per person · Children under 4</text><text x="26" y="746.3" font-size="15.1" text-anchor="start" font-weight="800" fill="#1f2a37" stroke="none">enter free</text><text x="26" y="768.5" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Buy at the door or at www.brightminds.sg</text><text x="26" y="786.7" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Bright Minds Science Club members get $5 off.</text><text x="180" y="825.7" font-size="13.4" text-anchor="middle" fill="#5c6878" stroke="none">For enquiries, call Mr Tan at 6789 1234.</text><rect x="1" y="1" width="358" height="836.2" rx="14" fill="none" stroke="#3D348B" stroke-width="2"/></g></g></svg>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 863" width="384" height="863" role="img" aria-labelledby="fig-p3eng-mission-02-q6-q9-title fig-p3eng-mission-02-q6-q9-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"><title id="fig-p3eng-mission-02-q6-q9-title">Bright Minds Science Club presents Starlight Night</title><desc id="fig-p3eng-mission-02-q6-q9-desc">A poster: Bright Minds Science Club presents Starlight Night. Date: Saturday, 28 November. Time: 6 p.m. to 9.30 p.m.. Venue: Starlight Planetarium, Level 2. Planet Show (6.30 p.m. and 8 p.m.). Telescope Corner (7 p.m. to 9 p.m.). Rocket Workshop (7.30 p.m.). Space Snacks (Open all evening).</desc><rect x="0" y="0" width="384" height="863" fill="#ffffff"/><g transform="translate(12 12)" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 0)"><rect x="1" y="1" width="358" height="199.9" rx="13" fill="#D9D4F5" stroke="none"/><rect x="1" y="16" width="358" height="184.9" fill="#D9D4F5" stroke="none"/><g transform="translate(14 13) scale(0.75)"><g transform="translate(0 0)"><polygon points="12,2 14.8,9.1 22.5,9.6 16.6,14.5 18.5,21.9 12,17.8 5.5,21.9 7.4,14.5 1.5,9.6 9.2,9.1" fill="#3D348B" stroke="#3D348B" stroke-width="1" stroke-linejoin="round"/></g></g><text x="38" y="27" font-size="14" text-anchor="start" font-weight="600" fill="#1f2a37" stroke="none">Bright Minds Science Club presents</text><text x="14" y="64.9" font-size="28" text-anchor="start" font-weight="800" fill="#3D348B" stroke="none">Starlight Night</text><text x="14" y="91.1" font-size="14.6" text-anchor="start" font-style="italic" fill="#1f2a37" stroke="none">Explore the planets and stars with</text><text x="14" y="110" font-size="14.6" text-anchor="start" font-style="italic" fill="#1f2a37" stroke="none">your family!</text><circle cx="310" cy="72" r="36" fill="#3D348B" stroke="none"/><text x="310"
11 16 10" fill="none" stroke="#2A7F62" stroke-width="1.8"/><line x1="12" y1="14" x2="12" y2="18" fill="none" stroke="#2A7F62" stroke-width="1.8"/><rect x="7.5" y="18" width="9" height="3" rx="1" fill="#BFE3C9" stroke="#2A7F62" stroke-width="1.6"/></g></g><text x="62" y="442" font-size="16.2" text-anchor="start" font-weight="800" fill="#2A7F62" stroke="none">Kite-Flying Contest</text><text x="62" y="462.2" font-size="14" text-anchor="start" font-weight="600" fill="#5c6878" stroke="none">4.30 p.m. to 5.30 p.m.</text><text x="62" y="485.2" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Open to children aged 7 to 12.</text><text x="62" y="503.4" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Prizes for the three highest-flying kites!</text><rect x="14" y="518.3" width="332" height="76" rx="10" fill="#ffffff" stroke="#2A7F62" stroke-width="1.6"/><g transform="translate(24 530.3) scale(1.167)"><g transform="translate(0 0)"><path d="M 3 12 L 21 12 Q 20 21 12 21 Q 4 21 3 12 Z" fill="#BFE3C9" stroke="#2A7F62" stroke-width="1.6"/><path d="M 9 9 Q 7 6 9 3 M 14 9 Q 12 6 14 3" fill="none" stroke="#2A7F62" stroke-width="1.8"/></g></g><text x="62" y="544.2" font-size="16.2" text-anchor="start" font-weight="800" fill="#2A7F62" stroke="none">Food Corner</text><text x="62" y="564.4" font-size="14" text-anchor="start" font-weight="600" fill="#5c6878" stroke="none">Open all afternoon</text><text x="62" y="587.4" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Buy snacks and drinks from our stalls.</text><rect x="14" y="602.3" width="332" height="94.2" rx="10" fill="#ffffff" stroke="#2A7F62" stroke-width="1.6"/><g transform="translate(24 614.3) scale(1.167)"><g transform="translate(0 0)"><rect x="4" y="10" width="16" height="11" rx="1.5" fill="#BFE3C9" stroke="#2A7F62" stroke-width="1.6"/><rect x="3" y="7" width="18" height="4" rx="1" fill="#BFE3C9" stroke="#2A7F62" stroke-width="1.6"/><line x1="12" y1="7" x2="12" y2="21" fill="none" stroke="#2A7F62" stroke-width="1.8"/><path d="M 12 7 C 8 1 4 5 12 7 C 20 5 16 1 12 7" fill="none" stroke="#2A7F62" stroke-width="1.8"/></g></g><text x="62" y="628.2" font-size="16.2" text-anchor="start" font-weight="800" fill="#2A7F62" stroke="none">Lucky Draw</text><text x="62" y="648.4" font-size="14" text-anchor="start" font-weight="600" fill="#5c6878" stroke="none">5.45 p.m.</text><text x="62" y="671.4" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">All visitors can take part.</text><text x="62" y="689.6" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Collect your ticket at the entrance.</text><rect x="14" y="704.5" width="332" height="94.2" rx="10" fill="#BFE3C9" stroke="#2A7F62" stroke-width="1.6"/><text x="26" y="727.4" font-size="15.1" text-anchor="start" font-weight="800" fill="#1f2a37" stroke="none">Kite-Making Workshop: register by 14</text><text x="26" y="746.3" font-size="15.1" text-anchor="start" font-weight="800" fill="#1f2a37" stroke="none">November</text><text x="26" y="768.5" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Register at www.brightwatercc.sg</text><text x="26" y="786.7" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Only 40 places available!</text><text x="180" y="825.7" font-size="13.4" text-anchor="middle" fill="#5c6878" stroke="none">For enquiries, call Ms Farah at 6123 4567.</text><rect x="1" y="1" width="358" height="836.2" rx="14" fill="none" stroke="#2A7F62" stroke-width="2"/></g></g></svg>

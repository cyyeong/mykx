<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 344 220" width="344" height="220" role="img" aria-labelledby="fig-p3sci-mission-magnets-01-m7ab-title fig-p3sci-mission-magnets-01-m7ab-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"><title id="fig-p3sci-mission-magnets-01-m7ab-title">Three ring magnets, A, B and C, were placed on a wooden rod as shown. The top face of A is a north pole.</title><desc id="fig-p3sci-mission-magnets-01-m7ab-desc">Rings on a wooden rod standing on a wooden base, from the bottom: A rests on the base; B floats above A with a gap; C floats above B with a gap. Labels: north pole is the top face of A; face P is the bottom face of B; face Q is the top face of B.</desc><rect x="0" y="0" width="344" height="220" fill="#ffffff"/><g transform="translate(12 12)" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(10 0)"><rect x="98" y="16" width="12" height="138" fill="#e8ecf1" stroke="#1f2a37" stroke-width="1.6"/><rect x="24" y="154" width="160" height="14" rx="2" fill="#e8ecf1" stroke="#1f2a37" stroke-width="1.8"/><rect x="56" y="134" width="96" height="20" rx="4" fill="#ffffff" stroke="#1f2a37" stroke-width="2"/><text x="42" y="150" font-size="16.8" text-anchor="middle" font-weight="700" fill="#1f2a37" stroke="none">A</text><rect x="56" y="92" width="96" height="20" rx="4" fill="#ffffff" stroke="#1f2a37" stroke-width="2"/><text x="42" y="108" font-size="16.8" text-anchor="middle" font-weight="700" fill="#1f2a37" stroke="none">B</text><rect x="56" y="50" width="96" height="20" rx="4" fill="#ffffff" stroke="#1f2a37" stroke-width="2"/><text x="42" y="66" font-size="16.8" text-anchor="middle" font-weight="700" fill="#1f2a37" stroke="none">C</text><line x1="188" y1="26" x2="110" y2="26" stroke="#5c6878" stroke-width="1.1"/><circle cx="110" cy="26" r="1.8" fill="#5c6878" stroke="none"/><text x="192" y="
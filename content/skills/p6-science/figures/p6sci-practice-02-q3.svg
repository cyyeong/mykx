<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 364 234" width="364" height="234" role="img" aria-labelledby="fig-p6sci-practice-02-q3-title fig-p6sci-practice-02-q3-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"><title id="fig-p6sci-practice-02-q3-title">Zoe released a toy car from the top of a ramp. The bar graph shows the amounts of energy the car had at point A near the bottom.</title><desc id="fig-p6sci-practice-02-q3-desc">A bar graph of Amount of energy (units): gravitational potential, kinetic, heat and sound. The scale has no numbers.</desc><rect x="0" y="0" width="364" height="234" fill="#ffffff"/><g transform="translate(12 12)" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 0)"><rect x="47" y="108" width="46" height="60" fill="#3d4a5c" stroke="#1f2a37" stroke-width="1.2"/><text x="70" y="187.6" font-size="14" text-anchor="middle" fill="#1f2a37" stroke="none">gravitational</text><text x="70" y="204.4" font-size="14" text-anchor="middle" fill="#1f2a37" stroke="none">potential</text><rect x="151" y="48" width="46" height="120" fill="#3d4a5c" stroke="#1f2a37" stroke-width="1.2"/><text x="174" y="188.5" font-size="14" text-anchor="middle" fill="#1f2a37" stroke="none">kinetic</text><rect x="255" y="148" width="46" height="20" fill="#3d4a5c" stroke="#1f2a37" stroke-width="1.2"/><text x="278" y="188.5" font-size="14" text-anchor="middle" fill="#1f2a37" stroke="none">heat and sound</text><line x1="18" y1="22" x2="18" y2="168" stroke="#1f2a37" stroke-width="1.8"/><line x1="18" y1="168" x2="330" y2="168" stroke="#1f2a37" stroke-width="1.8"/><text x="10" y="14" font-size="14" text-anchor="start" font-weight="600" fill="#1f2a37" stroke="none">Amount of energy (units)</text></g></g></svg>

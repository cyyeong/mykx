" cy="18" r="1.4" fill="#1f2a37"/><path d="M 26 22 Q 30 28 34 22 Z" fill="#1f2a37"/></g></g><rect x="129.3" y="272.1" width="101.4" height="32" rx="16" fill="#2E6B30" stroke="none"/><text x="180" y="294.6" font-size="17.9" text-anchor="middle" font-weight="800" fill="#ffffff" stroke="none">Join us</text><rect x="14" y="346.1" width="332" height="76" rx="10" fill="#ffffff" stroke="#2E6B30" stroke-width="1.6"/><g transform="translate(24 358.1) scale(1.167)"><g transform="translate(0 0)"><polygon points="12,2 14.8,9.1 22.5,9.6 16.6,14.5 18.5,21.9 12,17.8 5.5,21.9 7.4,14.5 1.5,9.6 9.2,9.1" fill="#2E6B30" stroke="#2E6B30" stroke-width="1" stroke-linejoin="round"/></g></g><text x="62" y="372" font-size="16.2" text-anchor="start" font-weight="800" fill="#2E6B30" stroke="none">Plant</text><text x="62" y="392.2" font-size="14" text-anchor="start" font-weight="600" fill="#5c6878" stroke="none">7.30 a.m. to 10 a.m.</text><text x="62" y="415.2" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Work in teams to plant native saplings.</text><rect x="14" y="430.1" width="332" height="94.2" rx="10" fill="#ffffff" stroke="#2E6B30" stroke-width="1.6"/><g transform="translate(24 442.1) scale(1.167)"><g transform="translate(0 0)"><rect x="3" y="5" width="18" height="16" rx="2.5" fill="#DCEFD5" stroke="#2E6B30" stroke-width="1.6"/><line x1="3" y1="10" x2="21" y2="10" fill="none" stroke="#2E6B30" stroke-width="1.8"/><line x1="8" y1="3" x2="8" y2="7" fill="none" stroke="#2E6B30" stroke-width="1.8"/><line x1="16" y1="3" x2="16" y2="7" fill="none" stroke="#2E6B30" stroke-width="1.8"/><circle cx="8" cy="14" r="1" fill="#2E6B30"/><circle cx="8" cy="18" r="1" fill="#2E6B30"/><circle cx="12" cy="14" r="1" fill="#2E6B30"/><circle cx="12" cy="18" r="1" fill="#2E6B30"/><circle cx="16" cy="14" r="1" fill="#2E6B30"/><circle cx="16" cy="18" r="1" fill="#2E6B30"/></g></g><text x="62" y="456" font-size="16.2" text-anchor="start" font-weight="800" fill="#2E6B30" stroke="none">Care</text><text x="62" y="476.2" font-size="14" text-anchor="start" font-weight="600" fill="#5c6878" stroke="none">Every visit</text><text x="62" y="499.2" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Water, mulch and measure the trees you</text><text x="62" y="517.4" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">planted.</text><rect x="14" y="532.3" width="332" height="94.2" rx="10" fill="#ffffff" stroke="#2E6B30" stroke-width="1.6"/><g transform="translate(24 544.3) scale(1.167)"><g transform="translate(0 0)"><circle cx="12" cy="12" r="9.5" fill="#DCEFD5" stroke="#2E6B30" stroke-width="1.6"/><ellipse cx="12" cy="12" rx="4" ry="9.5" fill="none" stroke="#2E6B30" stroke-width="1.8"/><line x1="2.5" y1="12" x2="21.5" y2="12" fill="none" stroke="#2E6B30" stroke-width="1.8"/></g></g><text x="62" y="558.2" font-size="16.2" text-anchor="start" font-weight="800" fill="#2E6B30" stroke="none">Learn</text><text x="62" y="578.4" font-size="14" text-anchor="start" font-weight="600" fill="#5c6878" stroke="none">Free workshop</text><text x="62" y="601.4" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Find out how trees cool our streets and</text><text x="62" y="619.6" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">shelter wildlife.</text><rect x="14" y="634.5" width="332" height="94.2" rx="10" fill="#ffffff" stroke="#2E6B30" stroke-width="1.6"/><g transform="translate(24 646.5) scale(1.167)"><g transform="translate(0 0)"><path d="M 7 3 L 17 3 L 16 11 Q 12 15 8 11 Z" fill="#DCEFD5" stroke="#2E6B30" stroke-width="1.6"/><path d="M 7 5 Q 2 5 4 9 Q 5 11 8 10 M 17 5 Q 22 5 20 9 Q 19 11 16 10" fill="none" stroke="#2E6B30" stroke-width="1.8"/><line x1="12" y1="14" x2="12" y2="18" fill="none" stroke="#2E6B30" stroke-width="1.8"/><rect x="7.5" y="18" width="9" height="3" rx="1" fill="#DCEFD5" stroke="#2E6B30" stroke-width="1.6"/></g></g><text x="62" y="660.4" font-size="16.2" text-anchor="start" font-weight="800" fill="#2E6B30" stroke="none">Belong</text><text x="62" y="680.6" font-size="14" text-anchor="start" font-weight="600" fill="#5c6878" stroke="none">Join 1,200 volunteers</text><text x="62" y="703.6" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">&quot;I came for the badge. I stayed for the</text><text x="62" y="721.8" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">friends.&quot; Priya, 15</text><rect x="14" y="736.7" width="332" height="93.5" rx="10" fill="#DCEFD5" stroke="#2E6B30" stroke-width="1.6"/><text x="26" y="759.6" font-size="15.1" text-anchor="start" font-weight="800" fill="#1f2a37" stroke="none">Sign up by 30 January</text><text x="26" y="781.8" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Visit greenhands.sg/join or ask at your school's</text><text x="26" y="800" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">general office.</text><text x="26" y="818.2" font-size="14" text-anchor="start" fill="#1f2a37" stroke="none">Gloves, tools and water are provided.</text><text x="180" y="857.2" font-size="13.4" text-anchor="middle" fill="#5c6878" stroke="none">Every tree you plant is a promise to the future.</text><rect x="1" y="1" width="358" height="867.7" rx="14" fill="none" stroke="#2E6B30" stroke-width="2"/></g></g></svg>

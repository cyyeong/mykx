<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 384 894" width="384" height="894" role="img" aria-labelledby="fig-s2eng-practice-01-q10-q14-title fig-s2eng-practice-01-q10-q14-desc" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, 'PingFang SC', 'Hiragino Sans GB', 'Noto Sans CJK SC', 'Microsoft YaHei', sans-serif"><title id="fig-s2eng-practice-01-q10-q14-title">Green Hands Youth Corps Plant a Tree, Grow a Future</title><desc id="fig-s2eng-practice-01-q10-q14-desc">A poster: Green Hands Youth Corps Plant a Tree, Grow a Future. When: Two Saturday mornings a month. Venue: Parks across the island. Sign up by: 30 January. Plant (7.30 a.m. to 10 a.m.). Care (Every visit). Learn (Free workshop). Belong (Join 1,200 volunteers).</desc><rect x="0" y="0" width="384" height="894" fill="#ffffff"/><g transform="translate(12 12)" stroke-linecap="round" stroke-linejoin="round"><g transform="translate(0 0)"><rect x="1" y="1" width="358" height="232.1" rx="13" fill="#DCEFD5" stroke="none"/><rect x="1" y="16" width="358" height="217.1" fill="#DCEFD5" stroke="none"/><g transform="translate(14 13) scale(0.75)"><g transform="translate(0 0)"><polygon points="12,2 14.8,9.1 22.5,9.6 16.6,14.5 18.5,21.9 12,17.8 5.5,21.9 7.4,14.5 1.5,9.6 9.2,9.1" fill="#2E6B30" stroke="#2E6B30" stroke-width="1" stroke-linejoin="round"/></g></g><text x="38" y="27" font-size="14" text-anchor="start" font-weight="600" fill="#1f2a37" stroke="none">Green Hands Youth Corps</text><text x="14" y="64.9" font-size="28" text-anchor="start" font-weight="800" fill="#2E6B30" stroke="none">Plant a Tree,</text><text x="14" y="97.1" font-size="28" text-anchor="start" font-weight="800" fill="#2E6B30" stroke="none">Grow a Future</text><text x="14" y="123.3" font-size="14.6" text-anchor="start" font-style="italic" fill="#1f2a37" stroke="none">Ever wished you could leave your</text><text x="14" y="142.2" font-size="14.6" text-anchor="start" font-style="italic" fill="#1f2a37" stroke="none">mark on the island?</text><circle cx="310" cy="72" r="36" fill="#2E6B30" stroke="none"/><text x="310" y="68.1" font-size="13.4" text-anchor="middle" font-weight="800" fill="#ffffff" stroke="none">AGES</text><text x="310" y="86" font-size="14.6" text-anchor="middle" font-weight="800" fill="#ffffff" stroke="none">13 TO 17</text><g transform="translate(14 153.3) scale(0.75)"><g transform="translate(0 0)"><rect x="3" y="5" width="18" height="16" rx="2.5" fill="#DCEFD5" stroke="#2E6B30" stroke-width="1.6"/><line x1="3" y1="10" x2="21" y2="10" fill="none" stroke="#2E6B30" stroke-width="1.8"/><line x1="8" y1="3" x2="8" y2="7" fill="none" stroke="#2E6B30" stroke-width="1.8"/><line x1="16" y1="3" x2="16" y2="7" fill="none" stroke="#2E6B30" stroke-width="1.8"/><circle cx="8" cy="14" r="1" fill="#2E6B30"/><circle cx="8" cy="18" r="1" fill="#2E6B30"/><circle cx="12" cy="14" r="1" fill="#2E6B30"/><circle cx="12" cy="18" r="1" fill="#2E6B30"/><circle cx="16" cy="14" r="1" fill="#2E6B30"/><circle cx="16" cy="18" r="1" fill="#2E6B30"/></g></g><text x="39" y="167.5" font-size="14.6" text-anchor="start" font-weight="700" fill="#1f2a37" stroke="none">When:</text><text x="87.5" y="167.5" font-size="14.6" text-anchor="start" fill="#1f2a37" stroke="none">Two Saturday mornings a month</text><g transform="translate(14 176.6) scale(0.75)"><g transform="translate(0 0)"><path d="M 12 22 C 6 15 4 12 4 9 A 8 8 0 0 1 20 9 C 20 12 18 15 12 22 Z" fill="#DCEFD5" stroke="#2E6B30" stroke-width="1.6"/><circle cx="12" cy="9" r="3" fill="#ffffff" stroke="#2E6B30" stroke-width="1.4"/></g></g><text x="39" y="190.8" font-size="14.6" text-anchor="start" font-weight="700" fill="#1f2a37" stroke="none">Venue:</text><text x="92.8" y="190.8" font-size="14.6" text-anchor="start" fill="#1f2a37" stroke="none">Parks across the island</text><g transform="translate(14 199.8) scale(0.75)"><g transform="translate(0 0)"><circle cx="12" cy="12" r="9.5" fill="#DCEFD5" stroke="#2E6B30" stroke-width="1.6"/><line x1="12" y1="
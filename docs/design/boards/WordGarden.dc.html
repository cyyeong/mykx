<style>
body{margin:0}
/* Ghost-hands keyboard: keys tinted by the finger that owns them; two see-through hands rest on the home row and
   the right finger reaches for the next key. Fingers are numbered 1–10 left to right (thumbs 5 and 6), and each
   key carries its finger's number softly in the corner. --u is one key unit (the board is 11 units wide).
   --kb-hand (set on the board root) is the hands' outline colour (white on dark boards, deep ink on light ones). */
.kb{position:relative;width:100%;container-type:inline-size;--kb-hand-line:var(--kb-hand,255,255,255)}
.kb-board{position:relative;width:100%;--u:calc(100cqw / 11);height:calc(var(--u) * 4.95);overflow:hidden}
.kb-key{position:absolute;box-sizing:border-box;width:calc(var(--u) * .9);height:calc(var(--u) * .9);padding:0;border:0;border-radius:calc(var(--u) * .18);background:linear-gradient(rgba(var(--f),.22),rgba(var(--f),.22)),var(--kb-key,#FFFFFF);color:var(--kb-ink,#2B2A5C);font:800 calc(var(--u) * .34)/1 var(--font-display);box-shadow:inset 0 -3px 0 rgba(var(--f),.75),0 2px 6px rgba(10,8,40,.18);cursor:pointer;transition:transform 90ms ease,box-shadow 160ms ease}
.kb-key:active{transform:translateY(2px)}
.kb-key--space{font-size:calc(var(--u) * .24);letter-spacing:.08em;text-transform:uppercase}
.kb-key--bump::after{content:"";position:absolute;left:35%;right:35%;bottom:16%;height:3px;border-radius:2px;background:currentColor;opacity:.45}
.kb-key--next{background:rgb(var(--f));color:#1E1C45;box-shadow:0 0 0 3px #FFFFFF,0 0 22px 6px rgba(var(--f),.95);animation:kb-pulse 1.1s ease-in-out infinite}
.kb-key--wrong{animation:kb-wobble .38s ease-in-out}
.kb-kn{position:absolute;top:calc(var(--u) * .07);right:calc(var(--u) * .09);font:800 calc(var(--u) * .15)/1 var(--font-display);opacity:.5;transition:opacity .4s}
.kb[data-hands="off"] .kb-kn{opacity:0}
@keyframes kb-pulse{50%{transform:translateY(-3px)}}
@keyframes kb-wobble{20%{transform:translateX(-4px) rotate(-3deg)}50%{transform:translateX(4px) rotate(3deg)}80%{transform:translateX(-2px)}}
.kb-hands{position:absolute;inset:0;pointer-events:none;transition:opacity .4s}
.kb-hands[data-mode="fade"]{opacity:.38}
.kb-hands[data-mode="off"]{opacity:0}
.kb-palm{position:absolute;top:calc(var(--u) * 3.4);width:calc(var(--u) * 4.2);height:calc(var(--u) * 2);border-radius:calc(var(--u) * 1.5) calc(var(--u) * 1.2) calc(var(--u) * .5) calc(var(--u) * .5)/calc(var(--u) * 1.1) calc(var(--u) * 1) calc(var(--u) * .5) calc(var(--u) * .5);background:linear-gradient(rgba(var(--kb-hand-line),.2),rgba(var(--kb-hand-line),.05));box-shadow:inset 0 0 0 1.5px rgba(var(--kb-hand-line),.5);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px);-webkit-mask-image:linear-gradient(#000 20%,transparent 80%);mask-image:linear-gradient(#000 20%,transparent 80%)}
.kb-palm--r{border-radius:calc(var(--u) * 1.2) calc(var(--u) * 1.5) calc(var(--u) * .5) calc(var(--u) * .5)/calc(var(--u) * 1) calc(var(--u) * 1.1) calc(var(--u) * .5) calc(var(--u) * .5)}
/* A finger: a soft capsule in its own colour, its number on the fingertip pad (on the lower half of the key it rests on, under the letter), two knuckle creases. The bottom fades into the palm. --rot is the splay; the badge
  
   turns back the other way so the number stays upright. */
.kb-finger,.kb-thumb{position:absolute;box-sizing:border-box;width:calc(var(--u) * .64);height:var(--len);border-radius:calc(var(--u) * .32) calc(var(--u) * .32) calc(var(--u) * .24) calc(var(--u) * .24);background:linear-gradient(rgba(255,255,255,.3),rgba(255,255,255,0) 45%),rgba(var(--f),.26);box-shadow:inset 0 0 0 1.5px rgba(var(--kb-hand-line),.6),0 calc(var(--u) * .06) calc(var(--u) * .16) rgba(12,10,40,.18);-webkit-mask-image:linear-gradient(#000 62%,transparent 98%);mask-image:linear-gradient(#000 62%,transparent 98%);transform-origin:50% 85%;transition:transform 420ms cubic-bezier(.34,1.56,.64,1),background .3s,box-shadow .3s}

.kb-finger::after{content:"";position:absolute;top:calc(var(--u) * 1.1);left:26%;right:26%;height:1.5px;border-radius:1px;background:rgba(var(--kb-hand-line),.38);box-shadow:0 calc(var(--u) * .44) 0 rgba(var(--kb-hand-line),.3)}
.kb-thumb{--len:calc(var(--u) * 1.5);width:calc(var(--u) * .7);transform-origin:50% 100%}
.kb-num{position:absolute;top:calc(var(--u) * .05);left:50%;display:grid;place-items:center;width:calc(var(--u) * .36);height:calc(var(--u) * .36);margin-left:calc(var(--u) * -.18);border-radius:50%;background:rgb(var(--f));color:#1E1C45;font:800 calc(var(--u) * .2)/1 var(--font-display);box-shadow:0 0 0 1.5px rgba(255,255,255,.9),0 2px 6px rgba(10,8,40,.22);opacity:.85;transform:rotate(calc(-1 * var(--rot, 0deg)));transition:transform 420ms cubic-bezier(.34,1.56,.64,1),opacity .3s}
.kb-thumb .kb-num{top:calc(var(--u) * .08)}
.kb-finger--on{background:linear-gradient(rgba(255,255,255,.35),rgba(255,255,255,0) 55%),rgba(var(--f),.72);box-shadow:inset 0 0 0 2px #FFFFFF,0 0 calc(var(--u) * .3) calc(var(--u) * .06) rgba(var(--f),.9)}
.kb-finger--on .kb-num{opacity:1;transform:rotate(calc(-1 * var(--rot, 0deg))) scale(1.2)}
.kb-hint{display:flex;align-items:center;justify-content:center;gap:6px;min-height:28px;margin:0 0 8px;text-align:center;font:800 16px/28px var(--font-text);color:var(--kb-hint,#FFFFFF);text-shadow:0 1px 8px rgba(10,8,40,.6)}
.kb-hint-n{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:50%;background:rgb(var(--f));color:#1E1C45;font:800 14px/1 var(--font-display);text-shadow:none;box-shadow:0 0 0 1.5px rgba(255,255,255,.9)}
.kb-hint-n:last-of-type{margin-right:4px}
@media (prefers-reduced-motion: reduce){.kb-key--next,.kb-key--wrong{animation:none}.kb-finger,.kb-thumb,.kb-num{transition:none}}
/* Living game backgrounds (shared by the arcade boards). A scene layer sits between the art and the UI:
   drifting fog, light and particles that never stop, a "heat" level that brightens as the child plays well
   (data-heat 0–3: combo, words done or blooms), a soft bloom on every hit (data-pulse a/b), and hidden tap
   spots whose reaction is different on each tap (data-act cycles). Only transform and opacity animate; fog and
   stars are 200 % wide with tiles that divide 50 %, so the loop is seamless. Colours come in as --c "r, g, b". */
.am{position:absolute;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.am i,.am b,.am-spots,.am-floor,.am-lasers,.am-fan,.am-warp,.am-rays,.am-shower{position:absolute;display:block}
@keyframes am-drift{to{transform:translateX(-50%)}}
@keyframes am-drift-r{from{transform:translateX(-50%)}to{transform:none}}
@keyframes am-breathe{from{opacity:var(--o,.5)}to{opacity:calc(var(--o,.5) * .55)}}
.am-fog{left:0;width:200%;top:var(--y,55%);height:var(--h,50%);background:radial-gradient(closest-side,rgba(var(--c),.6),rgba(var(--c),0)) 0 40%/25% 75% repeat-x,radial-gradient(closest-side,rgba(var(--c),.45),rgba(var(--c),0)) 8% 85%/12.5% 60% repeat-x,radial-gradient(closest-side,rgba(var(--c),.35),rgba(var(--c),0)) 30% 10%/50% 70% repeat-x;opacity:var(--o,.5);animation:am-drift var(--d,60s) linear infinite,am-breathe 9s ease-in-out infinite alternate}
.am-fog--r{animation:am-drift-r var(--d,60s) linear infinite,am-breathe 11s ease-in-out infinite alternate}

/* Particles: --x across, --s size, --d/--dl timing. "rise" floats bottom to top; "float" wanders in place. */
.am-mote{left:var(--x);width:var(--s,3px);height:var(--s,3px);border-radius:50%;background:rgb(var(--c));box-shadow:0 0 calc(var(--s,3px) * 2.5) rgba(var(--c),.9);opacity:0}
.am-mote--rise{bottom:-12px;animation:am-rise var(--d,10s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes am-rise{0%{transform:translate(0,0);opacity:0}10%{opacity:.9}50%{transform:translate(var(--dx,20px),-55vh)}90%{opacity:.7}100%{transform:translate(0,-110vh);opacity:0}}
.am-mote--float{top:var(--y);animation:am-wander var(--d,12s) ease-in-out infinite alternate,am-blink calc(var(--d,12s) / 3) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes am-wander{0%{transform:translate(0,0)}33%{transform:translate(var(--dx,24px),-18px)}66%{transform:translate(calc(var(--dx,24px) * -.6),12px)}100%{transform:translate(10px,-30px)}}
@keyframes am-blink{from{opacity:.15}to{opacity:.95}}
.am-mote--hot{visibility:hidden}
.am[data-heat="1"] .am-mote--hot,.am[data-heat="2"] .am-mote--hot,.am[data-heat="3"] .am-mote--hot{visibility:visible}

/* A soft bloom behind the action on every hit. */
.am-bloom{left:var(--bx,50%);top:var(--by,40%);width:80vmin;height:80vmin;margin:-40vmin 0 0 -40vmin;border-radius:50%;background:radial-gradient(closest-side,rgba(var(--c),.5),rgba(var(--c),0));opacity:0}
.am[data-pulse="a"] .am-bloom{animation:am-bloom-a .6s ease-out}
.am[data-pulse="b"] .am-bloom{animation:am-bloom-b .6s ease-out}
@keyframes am-bloom-a{0%{opacity:.9;transform:scale(.55)}100%{opacity:0;transform:scale(1.1)}}
@keyframes am-bloom-b{0%{opacity:.9;transform:scale(.55)}100%{opacity:0;transform:scale(1.1)}}

/* Running neon: a dim tube on each edge with two light dashes chasing round it (one lap = --lap). */
.am-edge{background:rgba(var(--c),.16);box-shadow:0 0 8px rgba(var(--c),.18)}
.am-edge--t,.am-edge--b{left:10px;right:10px;height:2px}
.am-edge--l,.am-edge--r{top:10px;bottom:10px;width:2px}
.am-edge--t{top:10px}.am-edge--b{bottom:10px}.am-edge--l{left:10px}.am-edge--r{right:10px}
.am-edge>b{border-radius:2px;opacity:0;animation:var(--k) var(--lap,6.4s) linear infinite;animation-delay:var(--at,0s)}
.am-edge--t>b,.am-edge--b>b{top:-1px;left:0;width:22%;height:4px}
.am-edge--l>b,.am-edge--r>b{left:-1px;top:0;width:4px;height:22%}
.am-edge--t>b{--k:am-lap-x;background:linear-gradient(90deg,rgba(var(--c),0),rgb(var(--c)) 75%,#FFFFFF);box-shadow:0 0 14px 3px rgba(var(--c),.75)}
.am-edge--b>b{--k:am-lap-xr;background:linear-gradient(270deg,rgba(var(--c),0),rgb(var(--c)) 75%,#FFFFFF);box-shadow:0 0 14px 3px rgba(var(--c),.75)}
.am-edge--r>b{--k:am-lap-y;background:linear-gradient(180deg,rgba(var(--c),0),rgb(var(--c)) 75%,#FFFFFF);box-shadow:0 0 14px 3px rgba(var(--c),.75)}
.am-edge--l>b{--k:am-lap-yr;background:linear-gradient(0deg,rgba(var(--c),0),rgb(var(--c)) 75%,#FFFFFF);box-shadow:0 0 14px 3px rgba(var(--c),.75)}
@keyframes am-lap-x{0%{transform:translateX(-100%);opacity:0}2%{opacity:1}23%{opacity:1}25%,100%{transform:translateX(455%);opacity:0}}
@keyframes am-lap-xr{0%{transform:translateX(455%);opacity:0}2%{opacity:1}23%{opacity:1}25%,100%{transform:translateX(-100%);opacity:0}}
@keyframes am-lap-y{0%{transform:translateY(-100%);opacity:0}2%{opacity:1}23%{opacity:1}25%,100%{transform:translateY(455%);opacity:0}}
@keyframes am-lap-yr{0%{transform:translateY(455%);opacity:0}2%{opacity:1}23%{opacity:1}25%,100%{transform:translateY(-100%);opacity:0}}
.am[data-heat="3"] .am-edge{background:rgba(var(--c),.4);box-shadow:0 0 14px rgba(var(--c),.5)}

/* ---- Neon arena ---- */
.am-spots{inset:0;opacity:.5;transition:opacity .8s}
.am-spot{top:-6%;width:56%;height:100%;margin-left:-28%;background:linear-gradient(rgba(var(--c),.55),rgba(var(--c),.16) 50%,rgba(var(--c),0) 88%);-webkit-mask-image:conic-gradient(from 160deg at 50% 0,transparent 0deg,#000 13deg,#000 27deg,transparent 40deg);mask-image:conic-gradient(from 160deg at 50% 0,transparent 0deg,#000 13deg,#000 27deg,transparent 40deg);transform-origin:50% 0;animation:am-sweep var(--d,8s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes am-sweep{from{transform:rotate(-17deg)}to{transform:rotate(17deg)}}
.am[data-heat="1"] .am-spots{opacity:.65}.am[data-heat="2"] .am-spots{opacity:.82}.am[data-heat="3"] .am-spots{opacity:1}
.am-floor{left:-30%;right:-30%;bottom:-4%;height:50%;overflow:hidden;opacity:.45;transform:perspective(300px) rotateX(60deg);transform-origin:50% 100%;-webkit-mask-image:linear-gradient(transparent,#000 40%);mask-image:linear-gradient(transparent,#000 40%);transition:opacity .8s}
.am-floor::before{content:"";position:absolute;left:0;right:0;top:-40px;bottom:0;background:repeating-linear-gradient(180deg,transparent 0 38px,rgba(255,61,203,.55) 38px 40px);animation:am-rush 1.3s linear infinite}
@keyframes am-rush{to{transform:translateY(40px)}}
.am[data-heat="2"] .am-floor{opacity:.75}.am[data-heat="3"] .am-floor{opacity:1}
.am-run{top:0;left:var(--x);width:4px;height:20%;margin-left:-2px;border-radius:2px;background:linear-gradient(rgba(var(--c),0),rgb(var(--c)) 80%,#FFFFFF);box-shadow:0 0 12px 2px rgba(var(--c),.9);opacity:0;animation:am-run var(--d,2.4s) cubic-bezier(.5,0,.9,.6) infinite;animation-delay:var(--dl,0s)}
@keyframes am-run{0%{transform:translateY(-100%);opacity:0}12%{opacity:1}100%{transform:translateY(520%);opacity:1}}
.am-horizon{left:0;right:0;top:var(--hz,52%);height:2px;background:linear-gradient(90deg,transparent,rgba(61,245,255,.9) 28%,#FFFFFF 50%,rgba(255,61,203,.9) 72%,transparent);box-shadow:0 0 22px 5px rgba(61,245,255,.35);animation:am-hz 3.4s ease-in-out infinite}
@keyframes am-hz{50%{opacity:.4;transform:scaleX(.82)}}
.am-lasers{left:50%;top:var(--hz,52%);width:0;height:0;opacity:0;transition:opacity .8s}
.am[data-heat="2"] .am-lasers{opacity:.55}.am[data-heat="3"] .am-lasers{opacity:.9}
.am-fan{left:0;top:0;width:0;height:0;animation:am-fan 3.6s ease-in-out infinite alternate}
.am-fan>i{left:-1px;top:0;width:2px;height:90vmax;transform-origin:50% 0;transform:rotate(var(--r));background:linear-gradient(rgba(var(--c),.95),rgba(var(--c),0) 60%);box-shadow:0 0 8px rgba(var(--c),.8)}
@keyframes am-fan{from{transform:rotate(-12deg)}to{transform:rotate(12deg)}}
/* Light-rig taps: colour swap, strobe, a laser fan, then every spot hunts for the centre. */
.am[data-show="rig-swap"] .am-spots{animation:am-swap 2.2s ease-in-out}
@keyframes am-swap{0%,100%{filter:none}50%{filter:hue-rotate(150deg) saturate(1.4)}}
.am[data-show="rig-strobe"] .am-spots{animation:am-strobe .18s steps(1) 6}
.am[data-show="rig-strobe"] .am-edge{animation:am-strobe .18s steps(1) 6}
@keyframes am-strobe{0%{opacity:1}50%{opacity:.08}}
.am[data-show="rig-fan"] .am-lasers{animation:am-fanburst 2.4s ease-out}
@keyframes am-fanburst{0%{opacity:0}12%,70%{opacity:1}100%{opacity:0}}
.am[data-show="rig-search"] .am-spot{animation:am-search 2.4s ease-in-out}
@keyframes am-search{0%,100%{transform:rotate(0)}40%,60%{transform:rotate(var(--rs,0deg))}}

/* ---- Space ---- */
.am-stars{left:0;top:0;width:200%;height:100%;animation:am-drift var(--d,200s) linear infinite}
.am-stars--1{--d:260s;opacity:.7;background:radial-gradient(circle at 12% 18%,#FFFFFF 0 1px,transparent 1.6px),radial-gradient(circle at 46% 64%,#EDE9FF 0 1px,transparent 1.6px),radial-gradient(circle at 78% 30%,#FFFFFF 0 .8px,transparent 1.4px),radial-gradient(circle at 30% 88%,#FFE38A 0 1px,transparent 1.6px),radial-gradient(circle at 88% 82%,#FFFFFF 0 .8px,transparent 1.4px);background-size:12.5% 240px}
.am-stars--2{--d:150s;opacity:.85;background:radial-gradient(circle at 20% 40%,#FFFFFF 0 1.4px,transparent 2px),radial-gradient(circle at 70% 12%,#C9B8FF 0 1.3px,transparent 2px),radial-gradient(circle at 58% 76%,#FFFFFF 0 1.2px,transparent 1.9px);background-size:25% 330px}
.am-stars--3{--d:90s;background:radial-gradient(circle at 34% 22%,#FFFFFF 0 1.8px,rgba(255,255,255,.35) 2.4px,transparent 4px),radial-gradient(circle at 82% 60%,#FFE38A 0 1.6px,rgba(255,227,138,.35) 2.3px,transparent 4px);background-size:25% 420px;animation:am-drift var(--d) linear infinite,am-twinkle 3.2s ease-in-out infinite alternate}
@keyframes am-twinkle{from{opacity:1}to{opacity:.35}}
.am-shoot{left:var(--x);top:var(--y);width:18%;height:2px;border-radius:2px;background:linear-gradient(90deg,#FFFFFF,rgba(255,255,255,.5) 25%,rgba(185,167,245,0));box-shadow:0 0 8px rgba(255,255,255,.7);transform-origin:0 50%;opacity:0;animation:am-shoot var(--d,9s) linear infinite;animation-delay:var(--dl,0s)}
@keyframes am-shoot{0%{opacity:0;transform:rotate(-32deg) translateX(0) scaleX(.2)}2%{opacity:1}10%{opacity:0;transform:rotate(-32deg) translateX(-70vmin) scaleX(1)}100%{opacity:0;transform:rotate(-32deg) translateX(-70vmin)}}
.am-shower{inset:0}
.am-shower>i{left:var(--x);top:var(--y);width:16%;height:2px;border-radius:2px;background:linear-gradient(90deg,#FFFFFF,rgba(255,227,138,0));box-shadow:0 0 10px #FFFFFF;transform-origin:0 50%;opacity:0}
.am[data-show="sky-shower"] .am-shower>i{animation:am-shoot 7s linear;animation-delay:var(--dl,0s)}
.am-warp{inset:0;opacity:0;transition:opacity 1s}
.am[data-heat="2"] .am-warp{opacity:.45}.am[data-heat="3"] .am-warp{opacity:.8}
.am-warp>i{left:50%;top:44%;width:150vmax;height:150vmax;margin:-75vmax 0 0 -75vmax;border-radius:50%;background:repeating-conic-gradient(rgba(255,255,255,0) 0 5deg,rgba(237,233,255,.35) 5deg 5.4deg);-webkit-mask-image:radial-gradient(circle,transparent 10%,#000 30%,transparent 62%);mask-image:radial-gradient(circle,transparent 10%,#000 30%,transparent 62%);animation:am-warp 1.8s linear infinite;animation-delay:var(--dl,0s)}
@keyframes am-warp{0%{transform:scale(.7) rotate(0);opacity:0}30%{opacity:1}100%{transform:scale(1.35) rotate(3deg);opacity:0}}

/* ---- Terrarium ---- */
.am-rays{inset:0;opacity:.75;transition:opacity 1s}
.am[data-heat="2"] .am-rays{opacity:.9}.am[data-heat="3"] .am-rays{opacity:1}
.am-ray{top:-30%;right:var(--x);width:var(--w,8%);height:150%;background:linear-gradient(rgba(255,244,200,.8),rgba(255,236,170,.34) 50%,rgba(255,236,170,0) 85%);-webkit-mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent);mask-image:linear-gradient(90deg,transparent,#000 35%,#000 65%,transparent);transform-origin:50% 0;transform:rotate(30deg);animation:am-ray var(--d,11s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes am-ray{0%{transform:rotate(27deg);opacity:.45}50%{opacity:1}100%{transform:rotate(33deg);opacity:.6}}
.am[data-pulse="a"] .am-rays{animation:am-sun-a .9s ease-out}
.am[data-pulse="b"] .am-rays{animation:am-sun-b .9s ease-out}
@keyframes am-sun-a{30%{filter:brightness(1.6)}}
@keyframes am-sun-b{30%{filter:brightness(1.6)}}
.am-fly{left:var(--x);top:var(--y);width:18px;height:18px;border-radius:50%;background:radial-gradient(circle,#FFFFFF 0 16%,#F4FF9A 26%,rgba(214,255,90,.7) 42%,rgba(214,255,90,0) 70%);opacity:0;animation:am-wander var(--d,10s) ease-in-out infinite alternate,am-glow 2.4s ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes am-glow{0%,30%{opacity:0}70%,100%{opacity:1}}
.am-drip{left:var(--x);top:-4%;width:6px;height:8px;border-radius:50% 50% 50% 50%/62% 62% 38% 38%;background:rgba(255,255,255,.55);box-shadow:inset -1px -1px 0 rgba(255,255,255,.95),0 0 3px rgba(255,255,255,.6);opacity:0;animation:am-drip var(--d,16s) ease-in infinite;animation-delay:var(--dl,0s)}
.am-drip::before{content:"";position:absolute;left:2px;bottom:100%;width:2px;height:60px;border-radius:2px;background:linear-gradient(rgba(255,255,255,0),rgba(255,255,255,.45));transform-origin:50% 100%;transform:scaleY(var(--trail,1))}
@keyframes am-drip{0%{transform:translateY(0);opacity:0}4%{opacity:.9}36%{transform:translateY(68vh);opacity:.85}44%,100%{transform:translateY(72vh);opacity:0}}
.am-leaf{left:var(--x);top:-6%;width:16px;height:16px;border-radius:0 80% 0 80%;background:linear-gradient(135deg,#8CCB5E,#2C7A47);box-shadow:inset 0 0 0 1px rgba(255,255,255,.25);opacity:0;animation:am-leaf var(--d,22s) ease-in-out infinite;animation-delay:var(--dl,0s)}

.am-poke--fog .am-r{width:100%;background:radial-gradient(closest-side,rgba(250,248,255,.95),rgba(220,205,255,.5) 55%,rgba(201,184,255,0))}

@keyframes la-sweep{0%{transform:translateX(-66.67%)}60%,100%{transform:translateX(0)}}

.la-sway{transform-origin:50% 100%;animation:la-sway var(--d,5s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes la-sway{from{transform:rotate(calc(-1 * var(--a,1.4deg)))}to{transform:rotate(var(--a,1.4deg))}}
.la-waver{transform-origin:50% 100%;animation:la-waver var(--d,3s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes la-waver{from{transform:skewX(calc(-1 * var(--a,2.4deg)))}to{transform:skewX(var(--a,2.4deg)) scaleY(1.015)}}
.la-mist{animation:la-mist var(--d,16s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes la-mist{0%{transform:translateX(calc(-1 * var(--dx,1cqw))) scale(1);opacity:.5}50%{opacity:1}100%{transform:translateX(var(--dx,1cqw)) scale(1.04);opacity:.65}}

.la-float{animation:la-float var(--d,7s) ease-in-out infinite alternate;animation-delay:var(--dl,0s)}
@keyframes la-float{from{transform:translateY(calc(-1 * var(--ay,.5cqh))) rotate(-.4deg)}to{transform:translateY(var(--ay,.5cqh)) rotate(.4deg)}}
.la-orbit{transform-origin:var(--o,50% 50%);animation:la-orbit var(--d,120s) linear infinite}

.la-sky::before{top:0;bottom:0;left:0;width:200%;background:radial-gradient(closest-side,rgba(255,240,250,.38),rgba(255,240,250,0)) 0 30%/25% 60% repeat-x,radial-gradient(closest-side,rgba(255,220,240,.28),rgba(255,220,240,0)) 12% 75%/12.5% 45% repeat-x;animation:la-sky-drift var(--d,90s) linear infinite}

@keyframes la-twinkle{0%{opacity:0}60%{opacity:.25}100%{opacity:.95}}
/* Aurora: soft bands of green, lilac and pink light flow through the aurora's (or a rainbow trail's) own shape. */
.la-aurora::before{top:0;bottom:0;left:0;width:300%;background:linear-gradient(100deg,rgba(150,255,210,0) 0%,rgba(150,255,210,.75) 12%,rgba(200,170,255,.7) 22%,rgba(255,170,220,.6) 30%,rgba(150,255,210,0) 40%,rgba(150,255,210,0) 50%,rgba(150,255,210,.7) 62%,rgba(200,170,255,.65) 72%,rgba(255,170,220,.55) 80%,rgba(150,255,210,0) 90%);mix-blend-mode:screen;animation:la-aurora var(--d,16s) linear infinite}

.la-shimmer::before{left:0;right:0;top:-24px;bottom:0;background:repeating-linear-gradient(180deg,rgba(255,255,255,0) 0 12px,rgba(255,255,255,.3) 17px,rgba(255,255,255,0) 22px 24px);animation:la-ripple var(--d,3.6s) linear infinite}

      letters: done ? [] : word.split('').map((ch, i) => ({ ch: i < s.typed ? ch.toUpperCase() : '', s: i < s.typed ? 'done' : i === s.typed ? 'now' : 'todo' })),
      lettersLabel: `${s.typed} of ${word.length} letters`,
      wig: s.wiggle ? (s.wiggle % 2 ? 'a' : 'b') : '',
      pots: this.PROMPTS.map((_, i) => {
        const g = i < s.q ? 1 : i === s.q ? 0.15 + (s.typed / word.length) * 0.55 : 0.05;
        return {
          s: i < s.q ? 'bloom' : i === s.q ? 'now' : 'wait',
          style: `--g: ${g.toFixed(2)}; --c: ${this.COLOURS[i]}`,
          drops: i === s.q && s.typed > 0 ? [{ style: `animation-name: ${s.typed % 2 ? 'wg-drop' : 'wg-drop2'}` }] : [],
        };
      }),
      bloomLabel: `${s.q} of ${this.PROMPTS.length} flowers`,
      bedLabel: `${s.q} flowers have bloomed`,
      showMiss: s.miss !== null,
      nextUpper: (next || '').toUpperCase(),
      handModes: [['on', 'Hands on'], ['fade', 'Fade'], ['off', 'Off']].map(([id, label]) => ({ label, pressed: handsMode === id ? 'true' : 'false', pick: () => this.setState({ hands: id }) })),
    };
  }

// ---- Ghost-hands keyboard (shared by the three typing looks) ----
  // Fingers are numbered 1–10 left to right, as a child counts them with both hands flat: left pinky 1 … left
  // pointer 4, thumbs 5 and 6, right pointer 7 … right pinky 10. Keys show their finger's number softly.
  kbModel(nextKey, wrongKey, handsMode) {
    const ROWS = ['qwertyuiop', 'asdfghjkl;', 'zxcvbnm,./'];
    const OFF = [0, 0.25, 0.75];
    const FINGER = { q: 'lp', a: 'lp', z: 'lp', w: 'lr', s: 'lr', x: 'lr', e: 'lm', d: 'lm', c: 'lm', r: 'li', f: 'li', v: 'li', t: 'li', g: 'li', b: 'li', y: 'ri', h: 'ri', n: 'ri', u: 'ri', j: 'ri', m: 'ri', i: 'rm', k: 'rm', ',': 'rm', o: 'rr', l: 'rr', '.': 'rr', p: 'rp', ';': 'rp', '/': 'rp', ' ': 'th' };
    const HOME = { lp: 'a', lr: 's', lm: 'd', li: 'f', ri: 'j', rm: 'k', rr: 'l', rp: ';' };
    const NUM = { lp: 1, lr: 2, lm: 3, li: 4, ri: 7, rm: 8, rr: 9, rp: 10 };
    const NAME = { lp: 'Left pinky', lr: 'Left ring', lm: 'Left middle', li: 'Left pointer', ri: 'Right pointer', rm: 'Right middle', rr: 'Right ring', rp: 'Right pinky', th: 'Thumb' };
    const TINT = { lp: '255, 159, 196', rp: '255, 159, 196', lr: '255, 201, 138', rr: '255, 201, 138', lm: '168, 240, 212', rm: '168, 240, 212', li: '185, 167, 245', ri: '185, 167, 245', th: '255, 227, 138' };
    const SPLAY = { lp: -9, lr: -4, lm: 0, li: 4, ri: -4, rm: 0, rr: 4, rp: 9 };
    const LEN = { lp: 2, lr: 2.3, lm: 2.45, li: 2.35, ri: 2.35, rm: 2.45, rr: 2.3, rp: 2 };
    const at = (k) => {
      if (k === ' ') return { x: 5.75, y: 3.5 };
      for (let r = 0; r < 3; r++) { const c = ROWS[r].indexOf(k); if (c > -1) return { x: OFF[r] + c + 0.5, y: r + 0.5 }; }
      return null;
    };
    const u = (n) => `calc(var(--u) * ${n.toFixed(3)})`;
    const next = nextKey ? nextKey.toLowerCase() : '';
    const active = FINGER[next] || null;
    const keys = [];
    ROWS.forEach((row, r) => row.split('').forEach((k, c) => {
      const f = FINGER[k];
      const cls = 'kb-key' + (k === next ? ' kb-key--next' : '') + (k === wrongKey ? ' kb-key--wrong' : '') + (k === 'f' || k === 'j' ? ' kb-key--bump' : '');
      keys.push({ k, label: k === ';' ? ';' : k.toUpperCase(), n: NUM[f], aria: `${k === ';' ? 'semicolon' : k.toUpperCase()}, finger ${NUM[f]}`, cls, style: `left: ${u(OFF[r] + c + 0.05)}; top: ${u(r + 0.05)}; --f: ${TINT[f]}`, press: () => this.typeKey(k) });
    }));
    keys.push({ k: ' ', label: 'space', n: '', aria: 'space, thumb 5 or 6', cls: 'kb-key kb-key--space' + (next === ' ' ? ' kb-key--next' : ''), style: `left: ${u(3)}; top: ${u(3.05)}; width: ${u(5.5)}; --f: ${TINT.th}`, press: () => this.typeKey(' ') });
    const fingers = Object.keys(HOME).map((f) => {
      const h = at(HOME[f]);
      const t = active === f ? at(next) : h;
      const dx = t.x - h.x, dy = t.y - h.y;
      return {
        n: NUM[f],
        cls: 'kb-finger' + (active === f ? ' kb-finger--on' : ''),
        style: `left: ${u(h.x - 0.32)}; top: ${u(h.y + 0.1)}; --len: ${u(LEN[f])}; --rot: ${SPLAY[f]}deg; transform: translate(${u(dx)}, ${u(dy)}) rotate(${SPLAY[f]}deg); --f: ${TINT[f]}`,
      };
    });
    const thumbOn = active === 'th' ? ' kb-finger--on' : '';
    const thumbs = [
      { n: 5, cls: 'kb-thumb' + thumbOn, style: `left: ${u(3.65)}; top: ${u(3.1)}; --rot: 24deg; transform: rotate(24deg); --f: ${TINT.th}` },
      { n: 6, cls: 'kb-thumb' + thumbOn, style: `left: ${u(7.15)}; top: ${u(3.1)}; --rot: -24deg; transform: rotate(-24deg); --f: ${TINT.th}` },
    ];
    return {
      kbKeys: keys,
      kbFingers: fingers.concat(thumbs),
      kbHands: handsMode,
      kbHint: active ? `${NAME[active]} → ${next === ' ' ? 'space' : next.toUpperCase()}` : '',
      kbHintNums: !active ? [] : (active === 'th' ? [5, 6] : [NUM[active]]).map((n) => ({ n, style: `--f: ${TINT[active]}` })),
    };
  }
// ---- Living background (shared by the arcade boards) ----
  // heat 0–3 brightens the scene as the child plays well; pulse 'a'/'b' flips on every hit so the bloom replays.
  // Each hidden tap spot plays its next reaction in turn, so taps feel different each time (no randomness).
  amModel(heat, pulse) {
    const SPOTS = { rig: ['swap', 'strobe', 'fan', 'search'], fogl: ['puff', 'ring', 'burst'], fogr: ['ring', 'burst', 'puff'], sky: ['frog', 'shower', 'rocket', 'crown'], planet: ['moon', 'ring', 'glint'], pond: ['ripple', 'bubbles', 'double', 'plip'], fern: ['spores', 'dew', 'fireflies'] };
    const am = this.state.am || { spot: '', act: '', n: {} };
    const vals = { amHeat: String(heat), amPulse: pulse || '', amShow: am.spot ? `${am.spot}-${am.act}` : '' };
    for (const [id, acts] of Object.entries(SPOTS)) {
      const key = id.charAt(0).toUpperCase() + id.slice(1);
      vals[`amAct${key}`] = am.spot === id ? am.act : '';
      vals[`am${key}`] = () => {
        const cur = this.state.am || { n: {} };
        const n = cur.n[id] || 0;
        this.setState({ am: { spot: id, act: acts[n % acts.length], n: { ...cur.n, [id]: n + 1 } } });
      };
    }
    return vals;
  }
}
</script>
